name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_TOOLCHAIN: "stable"
  WASM_TARGET: "wasm32-unknown-unknown"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cache-key: linux
          - os: macos-latest
            cache-key: macos
          - os: windows-latest
            cache-key: windows

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy
          target: ${{ env.WASM_TARGET }}

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            puzzle-core/target
          key: ${{ matrix.cache-key }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.cache-key }}-cargo-

      - name: Build core library
        run: |
          cd puzzle-core
          cargo build --verbose
          cargo test --verbose
          cargo clippy -- -D warnings

      - name: Build WASM
        run: |
          cd puzzle-core
          wasm-pack build --target web --verbose
          
          # Verify build output
          ls -la pkg/
          test -f pkg/puzzle_core_bg.wasm || (echo "Missing WASM binary" && exit 1)
          test -f pkg/puzzle_core.js || (echo "Missing JS bindings" && exit 1)
          test -f pkg/puzzle_core.d.ts || (echo "Missing TypeScript definitions" && exit 1)

      - name: Build web app
        run: |
          cd puzzle-web
          bun install
          bun run typecheck
          bun run build
          
          # Verify build output
          test -d dist || (echo "Missing dist directory" && exit 1)
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.os }}
          path: |
            puzzle-core/pkg/
            puzzle-web/dist/
          retention-days: 7

