name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.87
        
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        
      - name: Install additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          sudo apt-get install -y nodejs npm
          sudo npm install -g wasm-pack
          
      - name: Run cargo tests
        run: cd puzzle-core && cargo test
        
      - name: Build WASM module
        run: |
          cd puzzle-core
          wasm-pack build --target web --out-dir ../puzzle-web/src/wasm
          # Verify the build output
          ls -la ../puzzle-web/src/wasm
          # Check for wasm-bindgen files
          test -f ../puzzle-web/src/wasm/puzzle_core_bg.wasm
          test -f ../puzzle-web/src/wasm/puzzle_core.js

  web:
    name: Web Tests and Build
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install root dependencies
        run: bun install
        
      - name: Install web dependencies
        run: cd puzzle-web && bun install
        
      - name: Type checking
        run: cd puzzle-web && bun run typecheck
        
      - name: Lint
        run: bun run lint
        
      - name: Run web tests
        run: cd puzzle-web && bun test
        
      - name: Build web app
        run: cd puzzle-web && bun run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: puzzle-web/dist/

