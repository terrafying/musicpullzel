name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_TOOLCHAIN: "stable"
  WASM_TARGET: "wasm32-unknown-unknown"

jobs:
  rust:
    name: Rust Tests & WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang llvm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            puzzle-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get wasm-bindgen version
        id: wasm-bindgen
        run: |
          echo "version=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')" >> $GITHUB_OUTPUT

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --no-default-features

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run cargo tests
        run: cd puzzle-core && cargo test

      - name: Build WASM
        run: |
          cd puzzle-core
          wasm-pack build --target web
          ls -la pkg/
          test -f pkg/puzzle_core_bg.wasm
          test -f pkg/puzzle_core.js
          test -f pkg/puzzle_core.d.ts

  web:
    name: Web App Tests & Build
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang llvm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: |
            puzzle-web/node_modules
            puzzle-web/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('puzzle-web/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          cd puzzle-web
          bun install --frozen-lockfile

      - name: Run tests
        run: |
          cd puzzle-web
          bun test

      - name: Build web app
        run: |
          cd puzzle-web
          bun run build

