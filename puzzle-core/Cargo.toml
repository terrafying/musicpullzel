[package]
name = "puzzle-core"
version = "0.1.0"
edition = "2021"
description = "Core game logic for the musical puzzle game"
authors = ["Your Name"]
license = "MIT"
repository = "https://github.com/yourusername/music-puzzle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
anyhow = "1.0"
wasm-bindgen = { version = "0.2.88", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.3"
js-sys = "0.3.64"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5.0"
async-trait = "0.1"
thiserror = "1.0"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
wee_alloc = { version = "0.4", optional = true }

# Native-only dependencies
tch = { version = "0.13", optional = true }
tract-onnx = { version = "0.18", optional = true }
image = { version = "0.24", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
statrs = { version = "0.16", optional = true }

[features]
default = ["wasm"]
wasm = ["wee_alloc"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM-specific dependencies
web-sys = { version = "0.3.64", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window",
    "Performance",
    "PerformanceTiming",
    "console"
]}

[dev-dependencies]
wasm-bindgen-test = "0.3.38"

[profile.release]
opt-level = 3
lto = true
