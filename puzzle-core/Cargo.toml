[package]
name = "puzzle-core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Core library for the Harmonic Music Puzzle"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
wasm = ["getrandom/js", "wasm-bindgen", "js-sys", "web-sys", "serde-wasm-bindgen"]
std = []

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0.50"

# Random number generation
getrandom = { version = "0.2.10", optional = true }
rand = { version = "0.8.5", features = ["getrandom"] }

# WASM dependencies
wasm-bindgen = { version = "0.2.87", features = ["serde-serialize"], optional = true }
js-sys = { version = "0.3.64", optional = true }
web-sys = { version = "0.3.64", features = ["console"], optional = true }
serde-wasm-bindgen = { version = "0.6.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.37"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

[workspace]
members = ["."]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false
